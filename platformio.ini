; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Firmware env only, so a bare `pio run` does not try to build the native test
; env as firmware. Run the tests explicitly with `pio test -e native`.
[platformio]
default_envs = esp32s3_supermini

[env:esp32s3_supermini]
; Pinned to an exact pioarduino release rather than the bare name `espressif32`.
; The bare name resolves to the PlatformIO registry's Espressif platform, which
; stops at Arduino core 2.x -- and this firmware needs 3.x, because that is where
; FastLED's RMT5 driver lives (see the lib_deps note below). A machine that had
; already installed pioarduino globally would build fine off the bare name while
; a fresh clone failed, so the version now lives in the repo.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3 Super Mini specifics ---
; Confirmed hardware: ESP32-S3FH4R2 -> 4 MB embedded flash + 2 MB QUAD (QSPI) PSRAM.
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; default.csv splits the 4 MB into two 1.3 MB OTA app slots, but nothing here
; does OTA -- units are flashed over the native USB-C port -- so the second slot
; was pure overhead we were about to run out of room next to. huge_app.csv is
; one ~3 MB app slot instead, taking the firmware from ~74% full to ~32%.
; NVS stays at the same offset (0x9000) in both tables, so saved high scores and
; settings survive the switch; no erase_flash needed.
board_build.partitions = huge_app.csv
; qio_qspi = QIO flash + QSPI (quad) PSRAM. This is what the Arduino framework
; reads to enable PSRAM; the DevKitC-1 base otherwise defaults to no PSRAM.
board_build.arduino.memory_type = qio_qspi

; Serial monitor
monitor_speed = 115200

; Libraries
; FastLED uses the modern RMT5 driver on ESP32-S3 / Arduino core 3.x, avoiding the
; Adafruit NeoPixel 1.12.4+ RMT regression (issue #432) that produced no output.
lib_deps =
    fastled/FastLED@^3.9.0

build_flags =
    -DBOARD_HAS_PSRAM                 ; remove if your module has no PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1       ; enables Serial over the native USB-C port
    ; WS2812 protocol timing, slowed 15% below the 800 kHz nominal for more
    ; decode margin against noise on the data line -- see the "---- Display"
    ; section of defines.h. Must be a command-line define: it has to land
    ; before FastLED.h's own default, in every file that includes it.
    -DFASTLED_OVERCLOCK_WS2812=0.85

; --- Native (PC) test build ---
; The Tron and Virus sims are pure deterministic logic -- no Arduino calls at
; all -- so they run off-hardware. This env compiles just those sources against
; the Arduino/FastLED shims in test/shims and runs every test/test_* suite.
; test/stubs.cpp is shared by all suites (no-op Display, fake millis).
;
;   pio test -e native
;
; Nothing here affects the firmware builds: the shims are on this env's include
; path only, and the ESP32 envs never compile anything under test/.
[env:native]
platform = native
test_framework = unity
test_filter = test_*
test_build_src = yes
build_src_filter =
    -<*>
    ; The joystick's deadzone rescale, per-side centre scaling, step hysteresis
    ; and auto-repeat timing are pure arithmetic over an ADC reading, and the
    ; shims back analogRead with settable fake pins. A stick that double-steps
    ; once in twenty is close to untestable by hand and trivial to pin here.
    +<core/controls.cpp>
    +<games/tron/tron.cpp>
    ; Breakout's rules and fixed-point physics, with no Display or audio in the
    ; file at all -- so the same suite can play a screen out at 8x8 and at
    ; 16x16 and prove the panel upgrade is a configuration change.
    +<games/breakout/breakout_sim.cpp>
    ; Tetris's rules, split out of the Game for the same reason. Time arrives as
    ; a delta and the 7-bag takes a seed, so gravity, lock delay and bag
    ; fairness are all assertable without a clock.
    +<games/tetris/tetris_sim.cpp>
    ; Swarm's rules, split from the Game for the same reason again. The suite
    ; that earns its keep is the one asserting every weapon can kill every
    ; alien: players may all pick the same loadout, so a type that resists one
    ; weapon outright makes an unwinnable run -- and that is invisible on
    ; hardware until four people have already lost to it.
    +<games/swarm/swarm_sim.cpp>
    +<games/virus/virus.cpp>
    +<games/virus/virus_rules.cpp>
    ; virus_rules.cpp declares each virus's voice and may point at the shared
    ; catalog, so the catalog has to link here too. sfx.cpp is pure const data
    ; with no Arduino dependency (see src/audio/sound.h) -- that is deliberate,
    ; and this line is what would break first if it ever stopped being true.
    +<audio/sfx.cpp>
build_flags =
    -std=gnu++17
    -I test/shims
    -DVIRUS_TELEMETRY=0     ; the per-tick Serial standings would drown the test output
